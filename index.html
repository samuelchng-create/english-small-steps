:root{font-family:'DM Sans',system-ui,sans-serif;color:#223c35;background:#f6f5ef;line-height:1.6;font-size:16px;--green:#204d43;--muted:#68766e;--line:#dce2d9;--paper:#fffefa}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button,a,summary{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 17px;color:var(--green);font-weight:600;transition:background .15s,transform .15s}button:hover{background:#e8eee2}button:active{transform:translateY(1px)}button:disabled{opacity:.55;cursor:not-allowed}a{color:var(--green)}:focus-visible{outline:3px solid #cf8a3e;outline-offset:3px}h1,h2,h3{font-family:Manrope,system-ui,sans-serif;line-height:1.2;letter-spacing:-.045em}h1{font-size:clamp(2.5rem,4.7vw,4.4rem);font-weight:600;margin:12px 0 20px}h2{font-size:1.7rem;font-weight:600}h3{font-size:1.12rem;letter-spacing:-.02em}p{margin:0 0 16px}header{max-width:1260px;margin:auto;padding:25px 36px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:20px}.brand{font-family:Manrope,sans-serif;font-size:21px;font-weight:800;display:flex;align-items:center;gap:12px}.brandmark{background:var(--green);color:#f7f7da;border-radius:12px;padding:4px 12px;font-size:25px}.brand small{display:block;color:var(--muted);font:11px 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase}nav{display:flex;gap:4px;flex-wrap:wrap}nav button{border:0;background:transparent;font-size:14px}nav button.active{background:#e5eadf}main{max-width:1188px;margin:0 auto;padding:32px 20px 70px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#617766}.muted{color:var(--muted)}.small{font-size:13px}.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:40px;padding:28px 0 35px;align-items:center}.hero p{max-width:530px;font-size:17px;color:#67766d}.tag{display:inline-flex;align-items:center;gap:8px;background:#e8edde;border:1px solid #d7dfc9;border-radius:30px;padding:5px 12px;font-size:12px}.dot{height:7px;width:7px;border-radius:50%;background:#5b815d}.hero-art{min-height:290px;position:relative;border-radius:24px;background:#e8eddd;overflow:hidden;display:grid;place-items:center}.orbit{position:absolute;width:265px;height:265px;border-radius:50%;border:1px solid #c2ceb4}.orbit:after{content:'';position:absolute;inset:23px;border-radius:50%;border:1px dashed #c0cdae}.art-card{position:relative;transform:rotate(-7deg);background:#fffef3;box-shadow:0 18px 30px #233e3216;padding:25px;border-radius:16px;width:230px}.art-card b{font:600 23px Manrope,sans-serif;display:block;margin:8px 0 14px}.art-line{height:6px;background:#dce4d1;margin:9px 0;border-radius:5px}.art-badge{position:absolute;right:23px;bottom:24px;background:#d9e8b9;border:5px solid #e8eddd;border-radius:50%;width:65px;height:65px;display:grid;place-items:center;font-size:26px}.grid{display:grid;grid-template-columns:1.7fr 1fr;gap:24px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:27px}.mission-card{background:var(--green);color:#fffef0;position:relative;overflow:hidden;min-height:255px;display:flex;flex-direction:column;justify-content:space-between}.mission-card h2{font-size:2rem;max-width:480px;margin:14px 0}.mission-card .muted{color:#c9dbcf}.mission-card .eyebrow{color:#b8cfac}.primary{background:var(--green);color:#fffefa;border-color:var(--green)}.primary:hover{background:#346659}.light{background:#eef1ce;color:var(--green);border:0}.light:hover{background:#e0e8ad}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.section-head{display:flex;align-items:center;justify-content:space-between;margin:35px 0 18px;gap:15px}.section-head h2{font-size:1.35rem;margin:0}.topics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.topic{padding:20px;text-align:left;min-height:132px}.topic .icon{font-size:25px;background:#e9eddf;border-radius:12px;width:42px;height:42px;display:grid;place-items:center;margin-bottom:12px}.topic b{display:block}.topic.selected{border-color:#77915d;background:#edf2e3}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}.stat{background:#edf0e7;border-radius:14px;padding:17px}.stat strong{font:600 1.8rem Manrope,sans-serif;display:block}.stat span{font-size:12px;color:var(--muted)}.skill-row{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.skill-row:last-child{border:0}.bar{background:#e7eadd;height:5px;border-radius:5px;margin-top:8px}.bar span{display:block;background:#79945e;height:100%;border-radius:5px}.notice{background:#f2eddf;border:1px solid #e4dac4;border-radius:12px;padding:15px 18px;font-size:13px;margin:18px 0}.success{background:#e9f0dd;border-color:#d0debd}.danger{color:#8b3434}.practice{display:grid;grid-template-columns:1fr 1.15fr;gap:25px;align-items:start}.passage{white-space:pre-line;font-size:18px;line-height:1.85}.sticky{position:sticky;top:20px}.question{margin-bottom:18px}.question h3{line-height:1.5;letter-spacing:-.01em}.options{display:grid;gap:10px}.option{display:flex;gap:12px;border:1px solid var(--line);padding:13px;border-radius:12px;cursor:pointer;align-items:flex-start}.option:has(input:checked){background:#e8edde;border-color:#7b946b}.option input{margin-top:6px;accent-color:var(--green)}textarea,input[type=text]{width:100%;border:1px solid #cbd5c7;border-radius:12px;padding:13px;background:#fffefa;color:#223c35}textarea{min-height:120px;resize:vertical}label{display:block}.feedback{background:#edf1e6;border-left:3px solid #7c9560;border-radius:8px;padding:16px;margin:17px 0;white-space:pre-line}.checks label{display:flex;align-items:flex-start;gap:8px;font-size:14px;margin:9px 0}.checks input{margin-top:6px;accent-color:var(--green)}.week{margin-bottom:25px}.library-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.library-grid .card{display:flex;flex-direction:column;justify-content:space-between;gap:15px;padding:20px}.report{max-width:900px;margin:auto}.report h1{font-size:2.6rem}.report pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.report-entry{break-inside:avoid;border-top:1px solid var(--line);padding:18px 0}.report-entry blockquote{margin:8px 0;background:#f1f3ec;padding:12px;font-size:14px;white-space:pre-wrap}.report-entry b{font-size:14px}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#e9edde;font-size:11px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}footer{border-top:1px solid var(--line);max-width:1188px;margin:auto;padding:22px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:15px}.empty{text-align:center;padding:40px 15px}details{margin:14px 0}summary{cursor:pointer;font-weight:600}select{padding:9px;border-radius:10px;border:1px solid var(--line);background:#fffefa}#live{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#204d43;color:white;border-radius:12px;padding:10px 18px;max-width:85vw;z-index:10}#live:empty{display:none}.welcome{max-width:700px;margin:40px auto}.welcome h1{font-size:3rem}.welcome label{margin:15px 0}.feedback[hidden]{display:none}.metric{font-weight:700;font-size:24px}.progress-title{margin-top:5px}.count{font-size:12px;color:var(--muted);text-align:right}.linkbutton{border:0;background:transparent;text-decoration:underline;padding:8px}.report-controls{margin-bottom:20px}.no-print{}.ai{border:1px solid #cad5ed;background:#f0f4fb}.badge-ai{font-size:11px;background:#e0e8f8;padding:4px 7px;border-radius:6px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:760px){header{padding:18px 20px;align-items:flex-start;flex-direction:column;gap:12px}nav{width:100%;justify-content:space-between}nav button{padding:8px 10px}.hero{grid-template-columns:1fr;gap:20px;padding-top:15px}.hero-art{display:none}.grid,.practice{grid-template-columns:1fr}.sticky{position:static}.topics,.library-grid{grid-template-columns:repeat(2,1fr)}.card{padding:20px}.stats{gap:7px}.stat{padding:12px}.stat strong{font-size:1.5rem}main{padding-top:20px}h1{font-size:2.7rem}.hero p{font-size:16px}.mission-card h2{font-size:1.7rem}.report h1{font-size:2rem}footer{flex-direction:column}}@media print{body{background:white;font-size:11pt;color:black}header,footer,.no-print,#live{display:none!important}main{padding:0;max-width:100%}.report{max-width:100%}.card{border:0;padding:0}.report h1{font-size:25pt}.report-entry{break-inside:avoid}a{color:black}.stats{display:flex}.stat{flex:1}textarea{border:0}*{box-shadow:none!important}}

.exam-question{border:2px solid #9b7c42;background:#fffdf5}.exam-source{white-space:pre-line;padding:17px;background:#f1efe5;border-radius:12px;margin:17px 0;line-height:1.75}.question-text{white-space:pre-line}
</style></head><body><div id="app"></div><div id="live" role="status" aria-live="polite"></div><script type="module">// Original starter materials. Foundation practice, not official SEAB questions.
const skills=['Read & infer','Words & effects','Visual texts','Summary','Editing','Writing','Listen & speak'];
const worlds=[
 {topic:'Everyday mysteries',icon:'⌕',story:'At the school fair, Lina found a wallet beside the drinks stall. She looked around, then walked straight to the information desk. When a breathless boy arrived, she smiled and pointed to the volunteer holding it.',literal:['Where did Lina take the wallet?',['The information desk','Her classroom','The drinks stall'],0,'The text says she walked straight to the information desk.'],infer:['What does Lina’s action suggest?',['She wanted to return it safely','She wanted to keep the money','She knew the boy well'],0,'Taking it to the information desk suggests she wanted the owner to recover it. The passage does not establish that she knew the boy.'],clue:'walked straight to the information desk',word:['What does “breathless” suggest here?',['He had probably hurried','He was bored','He was whispering'],0,'“Breathless” suggests exertion; it supports the idea that he had hurried, though it does not prove why.'],summary:'The fair should provide clear signs so visitors can find stalls. A water station would let visitors refill bottles. Extra bins would reduce litter. Volunteers could help younger visitors find their families. Bright balloons would make the entrance look cheerful.',points:['Clear signs help visitors find stalls.','A water station allows bottle refills.','More bins reduce litter.','Volunteers help younger visitors find families.'],extra:'Bright balloons make the entrance cheerful.',prompt:'Your class is organising a fair. Write an email to your teacher recommending one activity. Explain who it is for, what visitors will do and why it is suitable.',audio:'The school fair opens at ten on Saturday. Entry is free, but game tokens cost two dollars each. Bring a refillable bottle. The information desk is beside the main entrance.',detail:['How much does one game token cost?',['Two dollars','Free','Ten dollars'],0,'Entry is free; tokens cost two dollars each.'],debate:'Should school events always raise money for charity?'},
 {topic:'Animals & care',icon:'♧',story:'Each afternoon, Amir left a bowl of water in the shade for the neighbourhood cat. One rainy day, the bowl was still full. He checked beneath the benches before asking the cleaner whether she had seen the cat.',literal:['Who did Amir ask about the cat?',['The cleaner','His teacher','A shopkeeper'],0,'He asked the cleaner whether she had seen the cat.'],infer:['What does Amir’s search suggest?',['He was concerned about the cat','He wanted to remove the benches','He was angry about the rain'],0,'Looking for the cat and asking someone about it suggest concern. The passage does not explain where the cat went.'],clue:'checked beneath the benches',word:['What does “still full” help us understand?',['The cat may not have drunk from it','The bowl had disappeared','Amir forgot the bowl'],0,'A full bowl may suggest the cat had not visited; other explanations remain possible.'],summary:'A shelter asks volunteers to wash food bowls to keep them clean. Volunteers also replace drinking water. They walk suitable dogs under supervision. They prepare comfortable bedding for animals. The shelter walls are painted yellow.',points:['Wash food bowls.','Replace drinking water.','Walk suitable dogs under supervision.','Prepare comfortable bedding.'],extra:'The shelter walls are yellow.',prompt:'Write a speech to your class proposing a visit to an animal shelter. Explain the purpose, two activities and one rule visitors must follow.',audio:'The shelter visit starts at nine on Sunday. Wear covered shoes. Visitors must not feed the animals without permission. Bring your own water. Meet the guide at the front gate.',detail:['What must visitors get permission to do?',['Feed the animals','Wear covered shoes','Bring water'],0,'Feeding requires permission. The other actions do not.'],debate:'Should everyone who wants a pet first learn how to care for it?'},
 {topic:'Design & choices',icon:'✧',story:'Mei tested two posters for the class concert. The first had tiny grey words; the second used a large dark heading. When her friend stepped back, he could read only the second. Mei put the first poster aside.',literal:['Which poster could the friend read from farther away?',['The second','The first','Neither'],0,'He could read only the second when he stepped back.'],infer:['Why did Mei probably put the first poster aside?',['It was harder to read at a distance','She disliked concerts','It contained the wrong date'],0,'The comparison supports readability as the reason. No wrong date is mentioned.'],clue:'he could read only the second',word:['What does “tiny” emphasise?',['The words were very small','The words were expensive','The words were colourful'],0,'“Tiny” emphasises small size and helps explain the reading difficulty.'],summary:'A good event poster needs a readable heading. It should show the date and time. The location should be easy to find. Contact details let readers ask questions. One designer keeps a blue mug beside her desk.',points:['Use a readable heading.','Show the date and time.','Make the location clear.','Include contact details.'],extra:'The designer keeps a blue mug.',prompt:'Write a report to the student council recommending improvements to a school-event poster. Explain two problems, your proposed changes and how students will benefit.',audio:'The design workshop is on Friday at three in the afternoon, in room twelve. Bring a pencil. Paper will be provided. Registration closes on Wednesday. There are twenty places.',detail:['When does registration close?',['Wednesday','Friday','At twelve'],0,'Wednesday is the deadline; Friday is the workshop day.'],debate:'Is a clear message more important than an attractive design?'},
 {topic:'People & fairness',icon:'↗',story:'During a group project, Jo noticed that Ben had not spoken. She moved the planning sheet towards him and asked which idea he preferred. The others stopped talking. Ben leaned forward and began to explain.',literal:['What did Jo move towards Ben?',['The planning sheet','A chair','A phone'],0,'Jo moved the planning sheet towards him.'],infer:['Why did Jo probably ask Ben for his preference?',['To include him in the discussion','To end the project','To show that his idea was wrong'],0,'Making space for his view suggests inclusion. There is no evidence that Jo wanted to reject his idea.'],clue:'asked which idea he preferred',word:['What does Ben leaning forward suggest in this context?',['He was becoming engaged','He was leaving the room','He was asleep'],0,'Alongside his beginning to explain, the movement suggests engagement.'],summary:'Groups can share tasks fairly by listing the work first. Members should discuss their available time. They can agree on roles together. Regular check-ins help identify anyone needing support. One group meets in a room with green chairs.',points:['List the work.','Discuss members’ available time.','Agree on roles together.','Check regularly for support needs.'],extra:'The meeting room has green chairs.',prompt:'Write a letter to your class chairperson recommending a fairer way to organise group projects. Explain the current problem, two changes and their benefits.',audio:'Each group has four members. Choose your roles together on Monday. Send the plan to your teacher by Thursday. The final presentation is the following Tuesday. Ask for help if a task is unclear.',detail:['When must the plan be sent?',['Thursday','Monday','Tuesday'],0,'Thursday is the plan deadline; Tuesday is the final presentation.'],debate:'Should every member of a group receive the same mark?'}
];
function mc(q,skill){return {type:'choice',question:q[0],options:q[1],correct:q[2],explanation:q[3],skill};}
const missions=worlds.flatMap((w,week)=>skills.map((skill,day)=>{
 const base={id:`w${week+1}d${day+1}`,week:week+1,day:day+1,topic:w.topic,icon:w.icon,skill,title:['Read between the lines','Every word leaves a clue','Look beyond the headline','Keep what matters','Repair the sentence','Make your message count','Listen, then have your say'][day],minutes:day===5?12:8,text:w.story,questions:[]};
 if(day===0)base.questions=[mc(w.literal,'Literal comprehension'),mc(w.infer,'Inference'),{type:'written',skill:'Evidence and explanation',question:'Explain your inference in one or two sentences. Use a clue from the passage.',hint:`Look at this clue: “${w.clue}”. What does it suggest?`,model:`${w.infer[1][w.infer[2]]}. The clue “${w.clue}” supports this because ${w.infer[3]}`,check:['I stated an inference.','I selected a relevant clue.','I explained the link.']}];
 if(day===1)base.questions=[mc(w.word,'Vocabulary in context'),{type:'written',skill:'Language effects',question:'Choose a word or phrase that helps you picture a person’s action. Explain the impression it creates.',hint:'Name the action, then explain what the wording makes you imagine. Avoid just saying “it is interesting”.',model:'An acceptable response identifies exact wording and explains an impression supported by the context. Different phrases can work.',check:['I chose exact wording.','I explained an impression.','My explanation fits the passage.']}];
 if(day===2){base.text=`[Practice poster]\n${['SCHOOL FAIR','SHELTER OPEN DAY','DESIGN WORKSHOP','TEAMWORK CLINIC'][week]}\nEveryone is welcome.\nTry something new—take your first step!\nSaturday, 10 am · Community Hall\nFree entry · Register with the school office by Friday.\n[Visual description: a large heading above a group of young people taking part together.]`;base.questions=[mc(['Who is the most likely audience?',['People considering attending','Only professional athletes','Only event organisers'],0,'The invitation and registration details address potential participants.'],'Audience and purpose'),mc(['What does the group image help suggest?',['People can take part together','Attendance is compulsory','The event has already ended'],0,'The group image supports participation together; it does not establish compulsory attendance.'],'Visual interpretation'),{type:'written',skill:'Persuasive language',question:'How does “take your first step” encourage the reader?',hint:'Think about a reader who feels unsure about trying a new activity.',model:'It presents starting as a manageable action, encouraging a hesitant reader to try.',check:['I explained the effect on a reader.','I used wording from the poster.']}];}
 if(day===3){base.text=w.summary;base.questions=[mc(['Which detail should be left out of a summary of the practical actions?',[w.extra,w.points[0],w.points[1]],0,'The first detail does not contribute to the requested practical actions.'],'Summary relevance'),{type:'written',skill:'Summary and paraphrase',question:'Summarise the practical actions in your own words, in no more than 50 words. This is a short foundation exercise; the exam summary is about 80 words.',hint:'Find the four relevant actions first. Combine ideas without changing their meaning.',model:w.points.join(' '),check:['I selected relevant points.','I removed unrelated details.','I preserved the meaning.','I checked the word limit.']}];}
 if(day===4){base.text='Fix the grammar. Read the whole sentence before deciding.';base.questions=[mc(['Choose the correct sentence.',['She walks to school every day.','She walk to school every day.','She walking to school every day.'],0,'A singular third-person subject takes “walks” in the simple present.'],'Subject–verb agreement'),mc(['Yesterday, the volunteers ___ the hall.',['cleaned','clean','cleans'],0,'“Yesterday” sets a past-time context, so “cleaned” fits.'],'Past tense'),{type:'written',skill:'Grammar transfer',question:'Write two sentences about a recent event: one about what happened, and one about what usually happens.',hint:'Use past tense for the recent event and present tense for the routine.',model:'We visited the shelter yesterday. The volunteers clean the bowls every morning.',check:['My event sentence uses past tense.','My routine sentence uses present tense.']}];}
 if(day===5){base.text=w.prompt;base.questions=[mc(['Before writing, what should you identify?',['Purpose, audience and required points','Only impressive vocabulary','Only the word count'],0,'Purpose, audience and required points guide content and tone.'],'Task analysis'),{type:'written',skill:'Situational writing',question:'Write a clear 80–120 word practice response. Cover the requested points. The full G2 situational task requires 180–250 words.',hint:'Make a three-point plan first. Use a clear opening, developed points and an appropriate ending.',model:'There is no single model answer. Check that the response addresses the named reader, fulfils each requested point, and explains its recommendations clearly.',check:['I addressed the correct audience.','I covered all required points.','I explained rather than only listed.','I checked grammar and tone.']},{type:'written',skill:'Continuous writing planning',question:`Plan a response to: “${w.debate}” Give your view, two reasons and one concrete example.`,hint:'A useful plan has a clear position, developed reasons and a specific example. A full G2 continuous-writing response is 250–400 words.',model:'Different views are acceptable. Each reason should support your position, and the example should illustrate a reason.',check:['My position is clear.','I have two distinct reasons.','My example is specific.']}];}
 if(day===6){base.text='Listen without reading a transcript first. Replay is allowed in this foundation exercise. Synthetic speech is a practice aid, not an exam recording.';base.audio=w.audio;base.questions=[mc(w.detail,'Listening for detail'),{type:'written',skill:'Listening notes',question:'Write two other details you heard, using brief notes.',hint:'Listen for dates, places, instructions and things to bring. You can open the transcript after trying.',model:w.audio,check:['My notes preserve two accurate details.','I did not confuse a deadline with an event date.']},{type:'written',skill:'Oral planning',question:`Say your response aloud for 30–60 seconds, then type brief notes: ${w.debate}`,hint:'Give your view, a reason and an example. Practise aloud before typing notes. No audio is recorded.',model:'A clear response states a view, explains it and uses a relevant example. This text-only activity does not assess pronunciation or delivery.',check:['I spoke aloud.','I gave a reason and example.','I could answer “why?”']}];}
 return base;
}));
// Spread correct options across positions so position cannot become a shortcut.
missions.forEach((m,mi)=>m.questions.forEach((q,qi)=>{if(q.type==='choice'){let shift=(mi+qi)%q.options.length;q.options=q.options.slice(shift).concat(q.options.slice(0,shift));q.correct=(q.correct-shift+q.options.length)%q.options.length;}}));

// Original exam-style transfer tasks. Practice allocations are indicative, not official marking.
const transfer=[
 {story:'After closing time, Nadia found a phone on a library chair. She handed it to the librarian and waited nearby. When its owner returned, Nadia let out a long breath and finally picked up her schoolbag.',infer:'What does Nadia letting out a long breath suggest about how she had been feeling? Support your answer with a detail from the passage. [2]',answer:'She had been worried or tense about the owner recovering the phone (1). She waited nearby and only picked up her schoolbag after the owner returned, suggesting she had stayed until the situation was resolved (1). Accept other supported interpretations.',phrase:'let out a long breath',effect:'Explain how the phrase “let out a long breath” conveys Nadia’s change of feeling. [2]',effectAnswer:'The long outward breath suggests a release of tension (1), showing relief when the phone was safely returned (1).'},
 {story:'The puppy stayed at the back of its carrier. Siti placed a blanket beside the opening and stepped away. A few minutes later, two paws appeared, followed by a nose. Siti remained still until the puppy climbed out.',infer:'What does Siti’s behaviour suggest about her understanding of the puppy? Support your answer with a detail from the passage. [2]',answer:'She understands that the puppy is nervous and needs time or space (1). She steps away or remains still rather than forcing it out, allowing it to emerge at its own pace (1).',phrase:'two paws appeared, followed by a nose',effect:'Explain how the description “two paws appeared, followed by a nose” conveys the puppy’s movement. [2]',effectAnswer:'Showing only small parts appearing one after another makes the movement seem gradual and hesitant (1), suggesting the puppy is cautiously testing whether it is safe to emerge (1).'},
 {story:'Ravi held his poster against the classroom wall. From the doorway, the date disappeared into a blur of pale letters. He took the poster down, reached for a black marker and began again.',infer:'What does Ravi’s decision to begin again suggest about his attitude towards his work? Support your answer with a detail from the passage. [2]',answer:'He is willing to improve his work or cares about making it useful (1). After noticing that the date is unreadable from the doorway, he takes it down and uses a black marker to make it clearer (1).',phrase:'a blur of pale letters',effect:'Explain how the phrase “a blur of pale letters” conveys the problem with the poster. [2]',effectAnswer:'“Blur” suggests the letters cannot be distinguished clearly (1), while “pale” suggests weak contrast, making the date difficult to read from a distance (1).'},
 {story:'At the meeting, Asha started to speak, then stopped as two classmates talked over her. Daniel put down his pen. “Let’s hear Asha’s idea first,” he said. Asha straightened in her chair and unfolded her notes.',infer:'What does Asha’s response to Daniel’s words suggest about her feelings? Support your answer with a detail from the passage. [2]',answer:'She feels encouraged or more confident that she will be heard (1). She straightens in her chair or unfolds her notes, preparing to contribute after Daniel gives her an opportunity (1).',phrase:'straightened in her chair and unfolded her notes',effect:'Explain how “straightened in her chair and unfolded her notes” conveys a change in Asha’s attitude. [2]',effectAnswer:'The upright posture suggests renewed confidence or readiness (1), and opening the notes shows that she is now preparing to contribute rather than withdrawing (1).'}
];
const summaryTopics=[

function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function aggregate(records){const a=records.flatMap(r=>r.answers.map((x,i)=>({...x,session:r.id,index:i}))).filter(x=>x.first!==null);return {attempted:a.length,choices:a.filter(x=>x.type==='choice').length,independentCorrect:a.filter(x=>x.type==='choice'&&x.correct&&!x.firstSupported).length,supported:a.filter(x=>x.firstSupported).length,revised:a.filter(x=>x.revisions.length>0).length,written:a.filter(x=>x.type==='written').length};}
function recommendation(records){const a=records.flatMap(r=>r.answers).filter(x=>x.first!==null);if(!a.length)return 'Complete a short mission to establish a starting point.';const groups={};for(const x of a){let g=groups[x.skill]??={n:0,need:0};g.n++;if(x.firstSupported||x.correct===false)g.need++;}const weakest=Object.entries(groups).sort((a,b)=>b[1].need-a[1].need)[0];return weakest&&weakest[1].need?`Practise ${weakest[0].toLowerCase()} with a new example, then reduce support. Based on ${weakest[1].n} attempted item(s); this is a teaching suggestion, not a mastery judgement.`:'Try unfamiliar material without hints to check transfer. Written responses still need tutor review.';}
function validateState(s){return s&&s.version===1&&Array.isArray(s.sessions)&&s.sessions.length<=1000&&s.sessions.every(r=>typeof r.id==='string'&&typeof r.missionId==='string'&&typeof r.started==='string'&&Array.isArray(r.answers)&&r.answers.length<=10&&r.answers.every(a=>a&&['choice','written'].includes(a.type)&&typeof a.skill==='string'&&(a.first===null||typeof a.first==='string'||Number.isInteger(a.first))&&Array.isArray(a.revisions)&&Number.isInteger(a.hints)&&a.hints>=0))&&Array.isArray(s.preferences)&&s.preferences.length<=1000&&typeof s.tutorNote==='string'&&typeof s.nickname==='string';}
function reportText(records,bank,nickname,note){const stats=aggregate(records);let lines=[`SMALL STEPS · TUTOR REPORT`, `Learner: ${nickname||'Learner'} · Generated ${new Date().toLocaleString('en-SG',{timeZone:'Asia/Singapore'})} (Singapore)`,`SEC G2 K200 foundation practice. Automated practice record; not an official grade.`,`Selected sessions: ${records.length}; finished: ${records.filter(r=>r.finished).length}.`,`Attempted items: ${stats.attempted}. Correct independent first-choice answers: ${stats.independentCorrect}/${stats.choices} attempted choice items.`,`Supported first attempts: ${stats.supported}. Written items: ${stats.written} (not automatically scored). Revised items: ${stats.revised}.`,`Repeated missions are practice, not fresh evidence of mastery.`, `PRIORITY: ${recommendation(records)}`,`TUTOR GUIDANCE ON THIS DEVICE: ${note||'None entered.'}`];for(const r of records){const m=bank.find(m=>m.id===r.missionId);if(!m)continue;lines.push(`\n${m.title} · ${m.topic} · ${r.finished?'Finished':'In progress'} · ${new Date(r.started).toLocaleString('en-SG',{timeZone:'Asia/Singapore'})}`,`PASSAGE: ${m.text}`);if(m.audio)lines.push(`LISTENING SCRIPT: ${m.audio}`);r.answers.forEach((a,i)=>{if(a.first===null)return;const q=m.questions[i];if(!q)return;const answer=v=>a.type==='choice'?(q.options[v]??'[invalid option]'):v;if(q.examStyle)lines.push('EXAM-STYLE FINAL QUESTION · '+q.paper+' · '+q.marks+' practice marks (tutor review)', 'TASK SOURCE: '+(q.source||m.text));lines.push(`\n${i+1}. ${q.question}`,`First response: ${answer(a.first)}`,`Assistance before first response: ${a.firstSupported?'Yes':'No'}; hints opened total: ${a.hints}; model/transcript exposed before first: ${a.modelBeforeFirst?'Yes':'No'}.`,`Outcome: ${a.type==='choice'?(a.correct?'Correct first choice':'Incorrect first choice'):'Written response — tutor review required'}.`,`Reference feedback: ${q.explanation||q.model}`);for(const rev of a.revisions)lines.push(`Revision: ${answer(rev.value)}`);if(a.aiFeedback)lines.push(`AI coaching (unverified): ${a.aiFeedback}`);});if(r.finished&&r.answers.length<m.questions.length)lines.push('Historical session: completed before the exam-style final question was added. No exam-style attempt is recorded.');if(r.reflection)lines.push(`Topic preference: ${r.reflection} (self-report, tentative).`);}
lines.push(`\nSUGGESTED 10-MINUTE TUTOR SCRIPT`,`1. Ask the learner to explain one answer in her own words (2 min).`,`2. Model one relevant skill using a different example (2 min).`,`3. Complete an example together, asking her to explain each step (3 min).`,`4. Give a fresh example without prompts; note assistance needed (2 min).`,`5. Agree one specific next step and enter guidance in the app (1 min).`,`No pronunciation or delivery score is inferred from typed oral notes. No conclusion about motivation is inferred from usage.`);return lines.join('\n');}

// Add new final questions to unfinished sessions; never invent attempts in completed history.
function newAnswer(q){return {type:q.type,skill:q.skill,draft:q.type==='choice'?null:'',first:null,correct:null,firstSupported:false,modelBeforeFirst:false,hints:0,modelViewed:false,revisions:[],checks:[],aiFeedback:''};}
function upgradeSessions(state,bank){for(const r of state.sessions){const m=bank.find(m=>m.id===r.missionId);if(!m||r.finished)continue;while(r.answers.length<m.questions.length)r.answers.push(newAnswer(m.questions[r.answers.length]));}return state;}

const esc=escapeHTML;

try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(validateState(parsed))state=parsed;else storageProblem='Saved data could not be read. Export any available backup before replacing it.';}}catch{storageProblem='Browser storage is unavailable. This session cannot be saved; download a backup before leaving.';}

function nextMission(){const complete=new Set(state.sessions.filter(r=>r.finished).map(r=>r.missionId));const topic=Number.isInteger(state.topic)?state.topic:0;return missions.find(m=>m.week===topic+1&&!complete.has(m.id))||missions.find(m=>!complete.has(m.id))||missions[state.sessions.length%missions.length];}
function page(content){return `<header><div class="brand"><span class="brandmark" aria-hidden="true">↗</span><div>Small Steps<small>A little English. Every day.</small></div></div><nav aria-label="Main navigation">${[['home','Today'],['library','Explore'],['progress','My progress'],['report','Tutor report'],['settings','Settings']].map(([v,t])=>`<button data-action="nav" data-view="${v}" class="${view===v?'active':''}" ${view===v?'aria-current="page"':''}>${t}</button>`).join('')}</nav></header><main>${storageProblem?`<div class="notice" role="alert">${esc(storageProblem)}</div>`:''}${content}</main><footer><span>SEC G2 English · K200 · Four-week foundation pilot</span><span>${aiAvailable?'AI coach available after an attempt':'Guided practice · AI coach not connected'} · Progress stays in this browser</span></footer>`;}
function welcome(){return `<div class="welcome card"><span class="tag"><i class="dot"></i>Your own pace</span><h1>Big progress starts<br>with a small step.</h1><p>Read a little. Try an answer. Get a hint when you need one.</p><p class="muted">You don’t need to know your favourite topic. We’ll try a few things together.</p><label for="nickname">What should we call you? <span class="muted small">Optional nickname</span></label><input id="nickname" type="text" maxlength="30" placeholder="A nickname is enough"><div class="notice">Your answers, hints and activity history are saved in this browser. Anyone using this browser can view them. Tutor reports include your written answers, but are only shared when you download or copy them. Nothing is emailed automatically. You can export or reset your data in Settings.</div><label class="row"><input id="understood" type="checkbox"> I understand what is saved and included in reports.</label><button class="primary" data-action="welcome">Let’s take the first step ↗</button><p class="small muted" style="margin-top:16px">This is a learning tool, not an official exam or a replacement for your tutor.</p></div>`;}
function home(){let m=nextMission(),done=state.sessions.filter(r=>r.finished).length,unfinished=[...state.sessions].reverse().find(r=>!r.finished);return `<section class="hero"><div><span class="tag"><i class="dot"></i>Small practice. Real progress.</span><h1>A little more confident.<br>One day at a time.</h1><p>${state.nickname?`Hello, ${esc(state.nickname)}. `:''}You don’t have to get it all right. Just take the next step, and we’ll work through it together.</p><div class="row small muted"><span>◷ Guided practice + an exam-style final step</span><span>·</span><span>Hints whenever you need them</span></div></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="art-card"><span class="eyebrow">YOUR NEXT CHAPTER</span><b>“I can work<br>this out.”</b><div class="art-line"></div><div class="art-line" style="width:80%"></div><div class="art-line" style="width:60%"></div></div><div class="art-badge">✦</div></div></section><div class="grid"><section class="card mission-card"><div><div class="eyebrow">YOUR NEXT SMALL MISSION · WEEK ${m.week}</div><h2>${esc(m.title)}</h2><p class="muted">${esc(m.topic)} · ${esc(m.skill)} · About ${m.minutes} minutes</p></div><div class="row"><button class="light" data-action="start" data-id="${m.id}">Start this mission ↗</button>${unfinished?`<button class="light" data-action="resume" data-id="${unfinished.id}">Resume saved session</button>`:''}</div></section><aside class="card"><span class="eyebrow">GROWING, NOT RACING</span><h3>Every attempt gives us a starting point.</h3><div class="stats"><div class="stat"><strong>${done}</strong><span>missions finished</span></div><div class="stat"><strong>${new Set(state.sessions.flatMap(r=>r.answers.filter(a=>a.first!==null).map(a=>a.skill))).size}</strong><span>skills tried</span></div><div class="stat"><strong>${state.preferences.filter(p=>p.value==='More like this').length}</strong><span>curiosity signals</span></div></div><p class="small muted">Missed a day? Welcome back. There’s no streak to lose.</p></aside></div><div class="section-head"><h2>What shall we explore?</h2><span class="small muted">No favourite topic needed.</span></div><div class="topics">${[0,1,2,3].map((i)=>{let t=missions[i*7];return `<button class="topic card ${state.topic===i?'selected':''}" data-action="topic" data-topic="${i}" aria-pressed="${state.topic===i}"><span class="icon" aria-hidden="true">${t.icon}</span><b>${esc(t.topic)}</b><span class="small muted">${state.topic===i?'Selected for your next mission':'Try a different setting →'}</span></button>`;}).join('')}</div><div class="notice"><b>How feedback works:</b> Choice questions have prepared explanations. Written responses use self-checks and tutor review. ${aiAvailable?'You can optionally request AI coaching after answering.':'Live AI coaching is not connected yet.'} Each mission ends with an original exam-style question. Writing and summary final tasks need extra time; most other tasks are short extracts.</div>`;}

function start(id){const m=byId(id);if(!m)return;const r={id:crypto.randomUUID(),missionId:id,started:new Date().toISOString(),finished:null,transcript:false,answers:m.questions.map(newAnswer)};state.sessions.push(r);activeId=r.id;save();go('practice');}
function practice(){let r=current();if(!r)return home();let m=byId(r.missionId);upgradeSessions(state,missions);return `<div class="row between"><button class="linkbutton" data-action="nav" data-view="home">← Back to today</button><span class="small muted">${r.finished?'Finished · review your work':'Saved as you go'} · ${r.answers.length} activities · <span id="elapsed"></span></span></div><div class="section-head"><div><span class="eyebrow">${esc(m.topic)} · ${esc(m.skill)}</span><h2 style="margin-top:8px">${esc(m.title)}</h2></div><span class="pill">Foundation practice</span></div><div class="practice"><section class="card sticky"><span class="eyebrow">${m.audio?'LISTEN FIRST':'READ & NOTICE'}</span><div class="passage">${esc(m.text)}</div>${m.audio?`<div class="actions"><button data-action="listen">▶ Play practice audio</button><button data-action="stop-audio">Stop</button></div><button class="linkbutton" data-action="transcript">${r.transcript?'Hide transcript':'Open transcript (counts as support)'}</button>${r.transcript?`<div class="feedback">${esc(m.audio)}</div>`:''}`:''}<details><summary>A useful exam habit</summary><p class="small muted">Read the question twice. Identify what it asks, find relevant information and check that your answer addresses it. In practice, take your time. Full exam timing comes later.</p></details>${state.tutorNote?`<div class="notice"><b>Your tutor’s focus</b><p>${esc(state.tutorNote)}</p></div>`:''}</section><section aria-label="Activities">${m.questions.slice(0,r.answers.length).map((q,i)=>question(q,r.answers[i],i,r.finished)).join('')}${r.finished?`<div class="card success"><h3>You took another small step.</h3><p>Your attempts and revisions are ready for your tutor report.</p><div class="row"><button class="primary" data-action="nav" data-view="report">View tutor report</button><button data-action="nav" data-view="home">Back to today</button></div></div>`:`<section class="card"><h3>How did this topic feel?</h3><label for="reflection" class="small muted">A preference, not a test.</label><select id="reflection"><option>Not sure yet</option><option>More like this</option><option>Something different</option></select><div class="actions"><button class="primary" data-action="finish">Finish & save this mission ✓</button></div><p class="small muted">Try every activity once before finishing. You can leave and resume at any time.</p></section>`}</section></div>`;}
function question(q,a,i,finished){if(q.examStyle&&current().answers.slice(0,i).some(x=>x.first===null))return `<article class="card question exam-question" id="question-${i}"><span class="eyebrow">FINAL STEP · EXAM-STYLE QUESTION</span><h3>Put the skill into exam words.</h3><p>Try the guided activities above to unlock a related written question.</p><p class="small muted">Original G2 practice · not an official exam question.</p></article>`;let tried=a.first!==null,value=a.revisions.length?a.revisions.at(-1).value:a.first;return `<article class="card question ${q.examStyle?'exam-question':''}" id="question-${i}">${q.examStyle?`<span class="tag">Final step · Exam-style question</span><p class="small muted">${esc(q.paper)} · ${q.marks} practice marks · Original practice, not an official exam question.</p>${q.note?`<p class="small muted">${esc(q.note)}</p>`:''}<div class="exam-source">${esc(q.source)}</div><p class="small">Try this question before opening any hints or reference guidance. Your tutor will review the answer.</p>`:''}<span class="eyebrow">${i+1} / ${current().answers.length} · ${esc(q.skill)}</span><h3 class="question-text">${esc(q.question)}</h3>${q.type==='choice'?`<div class="options">${q.options.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" data-q="${i}" ${a.draft===j?'checked':''} ${finished?'disabled':''}><span>${esc(o)}</span></label>`).join('')}</div>`:`<label class="sr-only" for="answer-${i}">Your answer to activity ${i+1}</label><textarea id="answer-${i}" data-q="${i}" maxlength="5000" placeholder="Try your answer here. It doesn’t have to be perfect." ${finished?'readonly':''}>${esc(a.draft)}</textarea><div class="count" id="words-${i}">${String(a.draft).trim().split(/\s+/).filter(Boolean).length} words</div>`}<div class="actions">${!finished?`<button class="primary" data-action="submit" data-q="${i}">${tried?'Save revision':q.examStyle?'Save exam-style answer':'Check my attempt'}</button>${!q.examStyle||tried?`<button data-action="hint" data-q="${i}">Give me a hint${a.hints?' · '+a.hints:''}</button>`:''}`:''}</div>${a.hints?`<div class="feedback"><b>Hint ${a.hints}</b>\n${esc(q.hint||(a.hints===1?'Identify exactly what the question asks. Find the part of the passage or audio that addresses it.':'Compare each option with the source. Reject ideas that add information the source does not support.'))}</div>`:''}${tried?`<div class="feedback" role="status"><b>${q.type==='choice'?(value===q.correct?'That choice fits the evidence.':'Let’s look again.'):'Your attempt is saved. Now check and improve.'}</b>\n${esc(q.explanation||'Written answers are not automatically scored. Use the checklist, then revise one part. Your tutor can review the full answer.')}</div>${q.check?`<div class="checks">${q.check.map((c,j)=>`<label><input type="checkbox" data-check="${j}" data-q="${i}" ${a.checks.includes(j)?'checked':''} ${finished?'disabled':''}>${esc(c)}</label>`).join('')}</div>`:''}${q.model?`<button class="linkbutton" data-action="model" data-q="${i}">${a.modelViewed?'Hide':'Show'} reference guidance</button>${a.modelViewed?`<div class="feedback">${esc(q.model)}</div>`:''}`:''}<p class="small muted">First attempt preserved · ${a.firstSupported?'Support used before answering':'No app support opened before answering'}${a.revisions.length?' · '+a.revisions.length+' revision(s)':''}</p>${q.type==='written'&&aiAvailable&&!finished?`<div class="notice ai"><label class="row small"><input type="checkbox" id="ai-consent-${i}"> Send this question, passage and my answer to the AI service for coaching. No nickname or tutor note is sent.</label><button data-action="ai" data-q="${i}">Ask the AI coach</button><p class="small muted">Feedback can be wrong. Your tutor can check it. No official mark is assigned.</p></div>`:''}${a.aiFeedback?`<div class="feedback ai"><span class="badge-ai">AI COACH · UNVERIFIED</span>\n${esc(a.aiFeedback)}</div>`:''}`:''}</article>`;}
function progress(){let a=aggregate(state.sessions);const entries=state.sessions.flatMap(r=>r.answers).filter(a=>a.first!==null);return `<span class="eyebrow">YOUR LEARNING, MADE VISIBLE</span><h1>Look how far you’ve tried.</h1><p class="muted">These are practice observations. Independent choices, supported work and written answers are shown separately.</p><div class="stats"><div class="stat"><strong>${a.independentCorrect}/${a.choices}</strong><span>correct independent first choices / all attempted choices</span></div><div class="stat"><strong>${a.supported}</strong><span>first attempts with app support</span></div><div class="stat"><strong>${a.revised}</strong><span>answers revised</span></div></div><div class="grid"><section class="card"><h2>Your skill practice</h2>${[...new Set(missions.flatMap(m=>m.questions.map(q=>q.skill)))].map(s=>{let e=entries.filter(a=>a.skill===s);return `<div class="skill-row row between"><span>${esc(s)}</span><span class="small muted">${e.length} attempted · ${e.filter(a=>a.type==='choice'&&a.correct&&!a.firstSupported).length} independently correct choices</span></div>`;}).join('')}</section><aside><section class="card"><h3>Your next useful step</h3><p>${esc(recommendation(state.sessions))}</p><p class="small muted">Written work needs review. Repeated missions and self-checks do not demonstrate mastery.</p></section><section class="card" style="margin-top:20px"><h3>Curiosity notes</h3>${state.preferences.length?state.preferences.slice(-8).reverse().map(p=>`<p class="small">${esc(p.topic)} · ${esc(p.value)}</p>`).join(''):'<p class="muted">Finish a mission to leave a topic preference. “Not sure” is useful too.</p>'}<p class="small muted">Preferences can change. These are not personality labels.</p></section></aside></div><div class="section-head"><h2>Recent practice</h2></div>${state.sessions.slice(-10).reverse().map(r=>`<div class="card row between" style="margin-bottom:12px"><div><b>${esc(byId(r.missionId)?.title)}</b><div class="small muted">${esc(new Date(r.started).toLocaleDateString('en-SG',{timeZone:'Asia/Singapore'}))} · ${r.finished?'Finished':'In progress'}</div></div><button data-action="resume" data-id="${r.id}">${r.finished?'Review':'Resume'}</button></div>`).join('')||'<p>No sessions yet. Your first attempt is a starting point.</p>'}`;}
function report(){let records=selectedRecords();return `<div class="report"><div class="no-print report-controls row between"><div class="row"><label for="range">Report period</label><select id="range"><option value="week" ${range==='week'?'selected':''}>Last 7 days</option><option value="latest" ${range==='latest'?'selected':''}>Latest session</option><option value="all" ${range==='all'?'selected':''}>All sessions</option></select></div><div class="row"><button data-action="copy-report">Copy report</button><button data-action="download-report">Download text</button><button class="primary" data-action="print">Print / save PDF</button></div></div><section class="card"><span class="eyebrow">SMALL STEPS · EVIDENCE FOR YOUR TUTOR</span><h1>Progress worth understanding.</h1><p class="muted">Original answers, support and revisions—not just a score.</p>${records.length?`<pre>${esc(reportText(records,missions,state.nickname,state.tutorNote))}</pre>`:'<div class="empty"><h2>A starting point is coming.</h2><p>Try a mission first. Your report will include actual answers and the help used.</p><button class="primary" data-action="nav" data-view="home">Go to today</button></div>'}</section><section class="card no-print" style="margin-top:20px"><h2>A note from the tutor</h2><p class="small muted">Enter guidance together after reviewing the report. This is a shared-device field, not a verified tutor account. It appears in future missions.</p><label for="tutor-note">Next teaching focus or correction to feedback</label><textarea id="tutor-note" maxlength="2000" placeholder="For example: identify the clue, then explain what it suggests.">${esc(state.tutorNote)}</textarea><div class="actions"><button data-action="save-note">Save guidance</button></div><p class="small muted">Reports are generated from saved records using a template. They do not diagnose ability or predict an exam grade. Copy or download to share manually.</p></section></div>`;}
function settings(){return `<div class="report"><span class="eyebrow">YOUR DATA & LEARNING SETUP</span><h1>Keep things simple.</h1><section class="card"><h2>Your nickname</h2><label for="edit-name" class="sr-only">Nickname</label><input type="text" id="edit-name" maxlength="30" value="${esc(state.nickname)}"><div class="actions"><button data-action="save-name">Save nickname</button></div><h2>Keep a backup</h2><p>Progress lives in this browser on this device. Clearing browser data removes it. Export a backup to move it to another device; importing replaces the current records.</p><div class="actions"><button data-action="backup">Download progress backup</button><label class="small">Import a backup<input id="import" type="file" accept="application/json,.json"></label></div><div class="notice">Backups and tutor reports contain written answers. Share them only with people you choose. This pilot has no cross-device account sync or automatic tutor email.</div><h2>AI coach</h2><p>${aiAvailable?'The server-side AI coach is connected. Each request requires your permission in the activity.':'Live AI coaching is not connected. Prepared explanations, self-checks and tutor reports work without it.'}</p><p class="small muted">A server administrator must configure OPENAI_API_KEY and OPENAI_MODEL. Keys are never entered into this webpage. AI coaching is optional and does not assign official marks.</p><h2>About this pilot</h2><p>Aligned to the skill areas of SEC G2 English K200 (2027). Original foundation exercises, shorter than exam tasks. Not affiliated with SEAB. No grade prediction, full-length exam simulator or automatic speech assessment.</p><p><a href="https://www.seab.gov.sg/secondary-education-certificate-sec/g2-syllabuses-for-school-candidates-2027/" target="_blank" rel="noopener">Official syllabus listing ↗</a></p><h2>Start afresh</h2><p>This removes practice records from this browser. Download a backup first if you want to keep them.</p><button class="danger" data-action="reset">Reset local progress</button></section></div>`;}
function render(){clearInterval(clock);root.innerHTML=page(!state.consented?welcome():({home,library,practice,progress,report,settings}[view]||home)());if(view==='practice'&&current()){const tick=()=>{const el=document.querySelector('#elapsed');if(el){const r=current(),n=Math.max(0,Math.floor(((r.finished?Date.parse(r.finished):Date.now())-Date.parse(r.started))/60000));el.textContent=n+' min since start (includes breaks)';}};tick();clock=setInterval(tick,10000);}}
function download(name,content,type){const b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
async function handle(action,b){let r=current(),qindex=Number(b.dataset.q),a=r?.answers[qindex],q=r?byId(r.missionId)?.questions[qindex]:null;
 if(action==='nav')return go(b.dataset.view);
 if(action==='welcome'){if(!document.querySelector('#understood').checked)return notify('Please read and acknowledge what is saved first.');state.nickname=document.querySelector('#nickname').value.trim();state.consented=true;save();return go('home');}
 if(action==='topic'){state.topic=Number(b.dataset.topic);save();render();return notify('Your next mission uses this setting. You can change it any time.');}
 if(action==='start')return start(b.dataset.id);
 if(action==='resume'){activeId=b.dataset.id;return go('practice');}
 if(action==='listen'){if(!('speechSynthesis'in window))return notify('Speech playback is unavailable. Use the transcript; it will be recorded as support.');window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(byId(r.missionId).audio);utterance.lang='en-SG';utterance.rate=.9;utterance.onerror=()=>notify('Audio could not play. You can use the transcript as supported practice.');window.speechSynthesis.speak(utterance);return;}
 if(action==='stop-audio'){window.speechSynthesis?.cancel();return;}
 if(action==='transcript'){r.transcript=!r.transcript;if(r.transcript)for(const x of r.answers){x.transcriptSeen=true;}save();return render();}
 if(action==='hint'){if(q.examStyle&&a.first===null)return notify('Try the exam-style question before using a hint.');a.hints=Math.min(2,a.hints+1);save();render();return;}
 if(action==='model'){a.modelViewed=!a.modelViewed;save();render();return;}
 if(action==='submit'){if(r.finished)return;if(q.examStyle&&r.answers.slice(0,qindex).some(x=>x.first===null))return notify('Try the guided activities first.');if(a.type==='choice'?a.draft===null:!String(a.draft).trim())return notify('Try an answer first. A short attempt is enough.');if(a.first===null){a.first=a.draft;a.firstSupported=!!(a.hints||a.modelViewed||a.transcriptSeen);a.modelBeforeFirst=!!(a.modelViewed||a.transcriptSeen);a.correct=a.type==='choice'?a.first===q.correct:null;}else{const last=a.revisions.at(-1)?.value??a.first;if(a.draft!==last)a.revisions.push({value:a.draft,at:new Date().toISOString()});}save();render();document.querySelector('#question-'+qindex)?.scrollIntoView({block:'nearest'});return;}
 if(action==='finish'){if(r.answers.some(a=>a.first===null))return notify('Try each activity once before finishing. Hints are available.');r.finished=new Date().toISOString();r.reflection=document.querySelector('#reflection').value;state.preferences.push({topic:byId(r.missionId).topic,value:r.reflection,at:r.finished});save();render();return notify('Mission saved. Your tutor report is ready.');}
 if(action==='save-note'){state.tutorNote=document.querySelector('#tutor-note').value.trim();save();render();return notify('Tutor guidance saved on this device.');}
 if(action==='save-name'){state.nickname=document.querySelector('#edit-name').value.trim();save();return notify('Nickname saved.');}
 if(action==='copy-report'){try{await navigator.clipboard.writeText(reportText(selectedRecords(),missions,state.nickname,state.tutorNote));notify('Report copied. You choose where to share it.');}catch{notify('Clipboard unavailable. Use Download text instead.');}return;}
 if(action==='download-report')return download('small-steps-tutor-report.txt',reportText(selectedRecords(),missions,state.nickname,state.tutorNote),'text/plain;charset=utf-8');
 if(action==='print')return window.print();
 if(action==='backup')return download('small-steps-progress.json',JSON.stringify(state,null,2),'application/json');
 if(action==='reset'){if(!confirm('Reset all practice records on this browser? Download a backup first if needed.'))return;state=fresh();save();go('home');return;}
 if(action==='ai'){if(!document.querySelector('#ai-consent-'+qindex)?.checked)return notify('Choose whether to send this answer to the AI service first.');b.disabled=true;b.textContent='Thinking…';try{const res=await fetch('/api/coach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({missionId:r.missionId,questionIndex:qindex,answer:String(a.draft)})});const data=await res.json();if(!res.ok)throw new Error(data.error||'AI coach unavailable.');a.aiFeedback=data.feedback;save();render();}catch(e){b.disabled=false;b.textContent='Ask the AI coach';notify(e.message);}return;}
}
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)handle(b.dataset.action,b).catch(()=>notify('That action could not be completed. Your saved attempts are unchanged.'));});
root.addEventListener('input',e=>{const el=e.target;if(el.matches('textarea[data-q]')){const r=current();if(!r||r.finished)return;const i=Number(el.dataset.q);r.answers[i].draft=el.value;save();const w=document.querySelector('#words-'+i);if(w)w.textContent=el.value.trim().split(/\s+/).filter(Boolean).length+' words';}});
root.addEventListener('change',async e=>{const el=e.target;if(el.id==='range'){range=el.value;render();return;}if(el.matches('input[type=radio][data-q]')){if(!current().finished){current().answers[Number(el.dataset.q)].draft=Number(el.value);save();}return;}if(el.matches('input[data-check]')){const a=current().answers[Number(el.dataset.q)],j=Number(el.dataset.check);a.checks=el.checked?[...new Set([...a.checks,j])]:a.checks.filter(x=>x!==j);save();return;}if(el.id==='import'){try{const f=el.files[0];if(!f)return;if(f.size>8_000_000)throw new Error('Backup is too large.');const imported=JSON.parse(await f.text());if(!validateState(imported)||imported.sessions.some(r=>!byId(r.missionId)||r.answers.length>byId(r.missionId).questions.length||r.answers.some((a,i)=>a.type!==byId(r.missionId).questions[i].type)))throw new Error('This is not a valid Small Steps backup.');if(!confirm('Replace the current browser records with this backup?'))return;state=upgradeSessions(imported,missions);state.consented=true;save();go('progress');notify('Backup imported.');}catch(e){notify(e.message||'Could not import this backup.');}}});
render();fetch('/api/status').then(r=>r.ok?r.json():null).then(x=>{if(x?.ai){aiAvailable=true;if(view!=='practice')render();}}).catch(()=>{});
</script></body></html>
